<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CheapToken - $5/mo AI API</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1419; color: #e8eaed;
    min-height: 100vh; padding: 20px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .tagline { color: #9aa0a6; margin-bottom: 24px; font-size: 14px; }
  .panel { background: #1a1f26; border: 1px solid #2d333b; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  h2 { margin-bottom: 12px; font-size: 16px; font-weight: 600; }
  input {
    background: #0d1117; border: 1px solid #2d333b; color: #e8eaed;
    padding: 8px 12px; border-radius: 4px; width: 100%; margin-bottom: 8px;
    font-size: 14px; outline: none;
  }
  input:focus { border-color: #2f81f7; }
  button {
    background: #2f81f7; color: white; border: none;
    padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #1f6feb; }
  button:disabled { background: #2d333b; cursor: not-allowed; }
  button.secondary { background: #2d333b; }
  .balance { color: #7ee787; font-weight: 600; }
  .chat-box {
    min-height: 300px; max-height: 500px; overflow-y: auto;
    padding: 12px; background: #0d1117; border-radius: 4px; margin-bottom: 12px;
  }
  .msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 4px; line-height: 1.5; }
  .msg.user { background: rgba(31, 111, 235, 0.2); border-left: 3px solid #2f81f7; }
  .msg.ai { background: #2d333b; border-left: 3px solid #7ee787; white-space: pre-wrap; }
  .msg-meta { font-size: 11px; color: #6e7681; margin-bottom: 8px; }
  .error { color: #ff7b72; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; margin-bottom: 0; }
  .header-info { flex: 1; font-size: 13px; }
  a { color: #2f81f7; }
</style>
</head>
<body>
<div class="container">
  <h1>CheapToken</h1>
  <div class="tagline">$5/mo AI API · Free 50K tokens · No credit card</div>

  <div id="auth-panel" class="panel">
    <h2>Sign in or register</h2>
    <input id="email" type="email" placeholder="email@example.com" autocomplete="email" />
    <input id="password" type="password" placeholder="password" autocomplete="current-password" />
    <div class="row" style="margin-top: 8px">
      <button onclick="doRegister()">Register (50K free)</button>
      <button onclick="doLogin()" class="secondary">Login</button>
    </div>
    <div id="auth-error" class="error"></div>
  </div>

  <div id="chat-panel" class="panel" style="display:none">
    <div class="row" style="margin-bottom: 12px">
      <div class="header-info">
        Logged in as <span id="me-email"></span> ·
        Balance: <span class="balance" id="me-balance">0</span> tokens
      </div>
      <button onclick="doLogout()" class="secondary" style="padding: 4px 12px; font-size: 12px">Logout</button>
    </div>
    <div id="chat-box" class="chat-box"></div>
    <div class="row">
      <input id="msg" placeholder="ask anything..." onkeydown="if(event.key==='Enter') doChat()" />
      <button onclick="doChat()">Send</button>
    </div>
    <div id="chat-error" class="error"></div>
  </div>
</div>

<script>
const API = ''; // same-origin
let token = localStorage.getItem('jwt');

function setError(id, msg) {
  document.getElementById(id).textContent = msg || '';
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(API + path, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

async function doRegister() {
  setError('auth-error', '');
  try {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) throw new Error('email and password required');
    const r = await api('POST', '/api/auth/register', { email, password });
    token = r.token;
    localStorage.setItem('jwt', token);
    enterChat(r.email, r.token_balance);
  } catch (e) {
    setError('auth-error', e.message);
  }
}

async function doLogin() {
  setError('auth-error', '');
  try {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) throw new Error('email and password required');
    const r = await api('POST', '/api/auth/login', { email, password });
    token = r.token;
    localStorage.setItem('jwt', token);
    enterChat(r.email, r.token_balance);
  } catch (e) {
    setError('auth-error', e.message);
  }
}

function doLogout() {
  token = null;
  localStorage.removeItem('jwt');
  document.getElementById('auth-panel').style.display = '';
  document.getElementById('chat-panel').style.display = 'none';
  document.getElementById('chat-box').innerHTML = '';
}

async function enterChat(email, balance) {
  document.getElementById('me-email').textContent = email;
  document.getElementById('me-balance').textContent = Number(balance).toLocaleString();
  document.getElementById('auth-panel').style.display = 'none';
  document.getElementById('chat-panel').style.display = '';
  document.getElementById('chat-box').innerHTML = '';
}

async function doChat() {
  setError('chat-error', '');
  const input = document.getElementById('msg');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  input.disabled = true;

  const box = document.getElementById('chat-box');
  box.insertAdjacentHTML('beforeend', `<div class="msg user">${escapeHtml(msg)}</div>`);
  box.insertAdjacentHTML('beforeend', `<div class="msg ai" id="loading">thinking...</div>`);
  box.scrollTop = box.scrollHeight;

  try {
    const r = await api('POST', '/api/chat', { message: msg });
    const loading = document.getElementById('loading');
    if (loading) loading.remove();
    box.insertAdjacentHTML('beforeend',
      `<div class="msg ai">${escapeHtml(r.reply)}</div>` +
      `<div class="msg-meta">used ${r.tokens_used} tokens · balance ${Number(r.token_balance).toLocaleString()}</div>`
    );
    document.getElementById('me-balance').textContent = Number(r.token_balance).toLocaleString();
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    const loading = document.getElementById('loading');
    if (loading) loading.remove();
    setError('chat-error', e.message);
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
}

// auto-restore session if token exists
(async () => {
  if (token) {
    try {
      const me = await api('GET', '/api/me');
      enterChat(me.email, me.token_balance);
    } catch {
      doLogout();
    }
  }
})();
</script>
</body>
</html>
